bio: |
  I am an MK Bhan Young Research Fellow at the International Centre for Genetic Engineering and Biotechnology (ICGEB), New Delhi. My research combines Systems Biology, Network Science, and Multi-Omics Data Integration to understand how complex biological systems are organized and how they become disrupted in disease. I develop graph-theoretic and computational approaches to identify higher-order structures—including network motifs, dynamic modules, and multi-way interaction patterns—that underlie biological function. Currently, I am investigating disease-associated molecular rewiring in temporal lobe epilepsy through integrative multi-omics analyses, with the long-term aim of advancing mechanistic disease understanding and therapeutic discovery.

